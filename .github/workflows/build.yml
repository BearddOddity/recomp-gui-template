name: build
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build
      - run: cmake --build build --config Release
      - run: build\Release\gui_smoke.exe
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libegl-dev libgl1-mesa-dri fonts-dejavu-core
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build
      - run: build/gui_smoke
      - run: build/portable_overlay_test
      - run: build/gl_render_test
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build
      - run: build/gui_smoke
      - run: build/portable_overlay_test
      - run: build/metal_render_test
